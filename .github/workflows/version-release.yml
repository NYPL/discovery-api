name: Version and release

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  version-bump:
    # required check gating PRs into production
    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-versionbump')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Enforce package version bump
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          base_version=$(git show origin/${{ github.event.pull_request.base.ref }}:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          head_version=$(node -pe 'require("./package.json").version')
          if [ "$base_version" = "$head_version" ]; then
            echo "package version ($head_version) must be bumped from ${{ github.event.pull_request.base.ref }}'s version ($base_version)."
            exit 1
          fi
          echo "verified that version bumped $base_version -> $head_version"

  tag-release:
    # tag production with the package version once the PR is merged
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Tag release
        run: |
          version=$(node -pe 'require("./package.json").version')
          tag="v$version"
          if git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            echo "Tag $tag already exists on origin, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
