name: Changelog

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - qa
      - production

permissions:
  contents: read

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Enforce CHANGELOG update
        uses: dangoslen/changelog-enforcer@v3
        with:
          skipLabels: 'skip-changelog'
