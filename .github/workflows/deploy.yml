name: Test-Deploy-Int-Roll

on:
  push:
    branches:
      - qa
      - production
      - qa2
      - SCC-5490/item-location-filter

# Global environment variable based on the branch name
# TODO: remove SCC-5490/item-location-filter stuff once this temporary qa2 deploy is over
env:
  ENV_TAG: ${{ github.ref_name == 'SCC-5490/item-location-filter' && 'qa2' || github.ref_name }}
  ECR_REPOSITORY: discovery-api

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  deploy:
    permissions:
      id-token: write
      contents: read
    needs: tests
    uses: ./.github/workflows/deploy-image.yml
    with:
      env_tag: ${{ github.ref_name == 'SCC-5490/item-location-filter' && 'qa2' || github.ref_name }}
      image_tag: ${{ github.sha }}

  smoke-test:
    permissions:
      id-token: write
      contents: read
    needs: deploy
    uses: ./.github/workflows/integration-tests.yml
    with:
      branch: ${{ github.ref_name == 'SCC-5490/item-location-filter' && 'qa2' || github.ref_name }}

  rollback:
    permissions:
      id-token: write
      contents: read
    needs: smoke-test
    if: ${{ failure() && needs.smoke-test.result == 'failure' }}
    uses: ./.github/workflows/rollback.yml
    with: 
      branch: ${{ github.ref_name == 'SCC-5490/item-location-filter' && 'qa2' || github.ref_name }}